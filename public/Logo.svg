<?xml version="1.0" encoding="UTF-8"?>
<svg id="wf_ams_logo_pub" data-name="Whisky Fest Amsterdam Logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 117.3 155.7">
  <defs>
    <style>
      .wf-pub-text-top {
        font-family: 'Bourbon-Rough', 'Bourbon', 'Rye', sans-serif;
        font-size: 11.5px;
        fill: #E30613;
        letter-spacing: 0.12em;
        font-weight: bold;
      }
      .wf-pub-text-whisky {
        font-family: 'Bourbon-Rough', 'Bourbon', 'Rye', sans-serif;
        font-size: 26px;
        fill: #1E1C1A;
        letter-spacing: 0.04em;
      }
      .wf-pub-text-fest {
        font-family: 'Bourbon-Rough', 'Bourbon', 'Rye', sans-serif;
        font-size: 19px;
        fill: #E30613;
        letter-spacing: 0.08em;
      }
      .wf-pub-text-est {
        font-family: 'Bourbon-Rough', 'Bourbon', 'Rye', sans-serif;
        font-size: 9.5px;
        fill: #B57402;
        letter-spacing: 0.14em;
        font-weight: bold;
      }
      .wf-pub-crest-border {
        fill: #1E1C1A;
      }
      .wf-pub-crest-gold {
        fill: #D5C28A;
      }
      .wf-pub-crest-bg {
        fill: #FAF7F2;
      }
    </style>
